services:
  - type: web
    name: regiq
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: REGIQ_VISION_ENABLED
        value: "true"
      - key: REGIQ_VISION_PROVIDER
        value: huggingface
      - key: REGIQ_HF_MODEL
        value: auto
      - key: REGIQ_AGENTIC_REGULATION_ENABLED
        value: "true"
      - key: REGIQ_REGULATION_MODEL
        value: auto
      - key: REGIQ_VERIFIER_MODEL
        value: auto
      - key: REGIQ_ALLOW_BYO_HF_TOKEN
        value: "false"
      - key: HF_TOKEN
        sync: false
